---
name: Hotspots
strategy: polling
polling_verb: get
# Public, keyless JSON published daily by the GitHub Actions pipeline.
polling_url: https://nikokoren.github.io/hotspots/latest.json
polling_headers: ''
refresh_interval: 360 # minutes; upstream data refreshes ~daily
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: About
  description: Recent volcanic thermal activity from NASA FIRMS VIIRS satellite data, matched to the Smithsonian
    Global Volcanism Program catalogue. Marker size shows relative observed heat (not eruption size or danger);
    solid, hatched and outline markers show observations up to 24, 48 and 72 hours old. No detection does not mean
    a volcano is inactive.
- keyname: region
  field_type: select
  name: Map
  description: The whole world centred on a region, or a close-up of one region.
  options:
  - 'World – centred on Europe & Africa': world-europe
  - 'World – centred on the Americas': world-americas
  - 'World – centred on Asia & Australia': world-asia
  - 'World – centred on the Pacific': world-pacific
  - 'Close-up – Europe & Mediterranean': europe
  - 'Close-up – Africa & Middle East': africa-middle-east
  - 'Close-up – North America & Alaska': north-america
  - 'Close-up – Central America & Caribbean': central-america
  - 'Close-up – South America': south-america
  - 'Close-up – Japan, Kurils & Kamchatka': east-asia
  - 'Close-up – Indonesia & Philippines': southeast-asia
  - 'Close-up – Melanesia, Tonga & New Zealand': southwest-pacific
  default: world-europe
- keyname: labels
  field_type: boolean
  name: Labels
  description: Name the most recently observed volcanoes on the map.
  default: false
